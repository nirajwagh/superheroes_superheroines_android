apply plugin: 'com.android.application'

android {
    namespace="com.theminimaldeveloper.superheroes"
    compileSdkVersion 35
    buildToolsVersion "29.0.3"

    defaultConfig {
        applicationId "com.theminimaldeveloper.superheroes"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 2
        versionName "1.1"

        resValue "string", "marvel_private_api_key", "dummy_private_key"
        resValue "string", "marvel_public_api_key", "dummy_public_key"
        resValue  "string", "youtube_api_key", "dummy_youtube_key"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {


        release {

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.airbnb.android:lottie:3.4.1'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    implementation 'com.pierfrancescosoffritti.androidyoutubeplayer:core:12.1.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'

    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'

}